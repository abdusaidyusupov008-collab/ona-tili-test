<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>O'quv Test Platformasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1a;
  --bg2:#111827;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --gold:#e8a020;--gold2:#c97d10;
  --blue:#3b82f6;--blue2:#1d4ed8;
  --green:#10b981;--green2:#065f46;
  --red:#ef4444;--red2:#991b1b;
  --text:#f1f0eb;--muted:#8899aa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  font-family:'Source Serif 4',serif;
  color:var(--text);
  min-height:100vh;
  background-image:
    radial-gradient(ellipse at 10% 10%,rgba(232,160,32,0.08) 0%,transparent 50%),
    radial-gradient(ellipse at 90% 90%,rgba(59,130,246,0.08) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.04) 0%,transparent 70%);
}
#app{max-width:600px;margin:0 auto;padding:16px;min-height:100vh;}

/* ========= ANIMATIONS ========= */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp 0.5s ease both;}
.fade-up-1{animation-delay:0.1s}
.fade-up-2{animation-delay:0.2s}
.fade-up-3{animation-delay:0.3s}

/* ========= NAVBAR ========= */
.navbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;margin-bottom:8px;
}
.nav-logo{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);font-weight:700;}
.nav-profile-btn{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;font-weight:700;
}

/* ========= HOME SCREEN ========= */
.home-header{text-align:center;padding:24px 0 32px;}
.home-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;line-height:1.2;margin-bottom:8px;}
.home-sub{color:var(--muted);font-size:14px;line-height:1.6;}
.subjects-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:28px;}
.subject-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:20px;cursor:pointer;
  transition:all 0.25s;position:relative;overflow:hidden;
}
.subject-card::before{
  content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.25s;
}
.subject-card:active{transform:scale(0.98);}
.subject-card.ona-tili::before{background:linear-gradient(135deg,rgba(232,160,32,0.12),transparent);}
.subject-card.tarix::before{background:linear-gradient(135deg,rgba(59,130,246,0.12),transparent);}
.subject-card.ingliz::before{background:linear-gradient(135deg,rgba(16,185,129,0.12),transparent);}
.subject-card:hover::before{opacity:1;}
.subject-card:hover{border-color:rgba(255,255,255,0.2);transform:translateY(-2px);}
.sc-header{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.sc-icon{font-size:36px;}
.sc-info h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;}
.sc-info p{color:var(--muted);font-size:13px;margin-top:2px;}
.sc-stats{display:flex;gap:16px;}
.sc-stat{text-align:center;}
.sc-stat-num{font-size:20px;font-weight:700;}
.sc-stat-label{font-size:11px;color:var(--muted);margin-top:2px;}
.sc-arrow{margin-left:auto;font-size:20px;color:var(--muted);}

/* ========= REYTING ========= */
.reyting-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:20px;margin-bottom:14px;
}
.reyting-title{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.reyting-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.reyting-row:last-child{border-bottom:none;}
.reyting-rank{width:28px;text-align:center;font-weight:700;font-size:15px;}
.reyting-rank.gold{color:#f59e0b;}
.reyting-rank.silver{color:#9ca3af;}
.reyting-rank.bronze{color:#cd7c3a;}
.reyting-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;}
.reyting-name{flex:1;font-size:14px;}
.reyting-score{font-weight:700;font-size:14px;color:var(--gold);}

/* ========= PROFIL ========= */
.profil-header{text-align:center;padding:24px 0;}
.profil-avatar{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:700;color:#fff;margin:0 auto 12px;
  border:3px solid rgba(232,160,32,0.4);
}
.profil-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;}
.profil-stats{display:flex;gap:0;margin:20px 0;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.profil-stat{flex:1;text-align:center;padding:16px 8px;border-right:1px solid var(--border);}
.profil-stat:last-child{border-right:none;}
.profil-stat-num{font-size:22px;font-weight:700;color:var(--gold);}
.profil-stat-label{font-size:11px;color:var(--muted);margin-top:4px;}
.profil-history{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.profil-history-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--muted);}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.history-item:last-child{border-bottom:none;}
.history-fan{font-size:13px;}
.history-ball{font-size:13px;font-weight:700;}
.invite-btn{
  width:100%;background:linear-gradient(135deg,var(--blue),var(--blue2));
  border:none;border-radius:14px;padding:14px;
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  font-family:'Source Serif 4',serif;display:flex;align-items:center;justify-content:center;gap:8px;
}

/* ========= FAN SCREEN ========= */
.fan-header{text-align:center;padding:20px 0 24px;}
.fan-icon{font-size:52px;margin-bottom:8px;}
.fan-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;}
.fan-sub{color:var(--muted);font-size:13px;margin-top:6px;}
.bolimlar-grid{display:flex;flex-direction:column;gap:10px;}
.bolim-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:16px;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  transition:all 0.2s;
}
.bolim-card:active{transform:scale(0.98);}
.bolim-card:hover{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);}
.bolim-num{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;flex-shrink:0;
}
.bolim-info{flex:1;}
.bolim-info h4{font-size:14px;font-weight:600;margin-bottom:2px;}
.bolim-info p{font-size:12px;color:var(--muted);}
.bolim-arrow{color:var(--muted);font-size:16px;}
.bolim-done{font-size:16px;}

/* ========= QUIZ ========= */
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.q-counter{color:var(--muted);font-size:13px;}
.timer{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:5px 14px;font-size:15px;font-weight:600;transition:all 0.3s;}
.timer.urgent{background:rgba(239,68,68,0.2);border-color:rgba(239,68,68,0.5);color:#ef4444;}
.score-badge{color:var(--green);font-size:13px;}
.progress-bar{height:5px;background:rgba(255,255,255,0.08);border-radius:999px;margin-bottom:18px;overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;transition:width 0.4s ease;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 12px 36px rgba(0,0,0,0.4);}
.category-tag{display:inline-block;border-radius:8px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:0.5px;margin-bottom:14px;text-transform:uppercase;}
.question-text{font-size:16px;line-height:1.75;color:var(--text);margin-bottom:20px;font-weight:500;}
.options{display:flex;flex-direction:column;gap:10px;}
.option-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.2s;text-align:left;font-family:'Source Serif 4',serif;}
.option-btn:active{transform:scale(0.98);}
.option-btn.selected{background:rgba(232,160,32,0.15);border-color:rgba(232,160,32,0.7);}
.option-btn.correct{background:rgba(16,185,129,0.2);border-color:var(--green);}
.option-btn.wrong{background:rgba(239,68,68,0.15);border-color:var(--red);}
.option-circle{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,0.25);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.option-text{color:#cde4f0;font-size:14px;line-height:1.5;}
.explanation{margin-top:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:13px;animation:fadeUp 0.3s ease;}
.explanation p{color:var(--muted);font-size:13px;line-height:1.6;}
.explanation strong{color:var(--text);}
.btn-row{display:flex;gap:10px;margin-top:18px;}
.btn-confirm{flex:1;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:12px;padding:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'Source Serif 4',serif;transition:all 0.2s;}
.btn-confirm:disabled{background:rgba(255,255,255,0.07);color:#555;cursor:not-allowed;}
.btn-next{flex:1;background:linear-gradient(135deg,#2980b9,#1abc9c);border:none;border-radius:12px;padding:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'Source Serif 4',serif;}

/* ========= RESULT ========= */
.result-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:14px;animation:fadeUp 0.5s ease;}
.result-emoji{font-size:60px;}
.result-title{font-family:'Playfair Display',serif;font-size:22px;}
.result-score{font-size:54px;font-weight:700;}
.result-grade{font-size:16px;font-weight:600;}
.stats-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;display:flex;justify-content:space-around;}
.stat{text-align:center;}
.stat-num{font-size:28px;font-weight:700;margin-bottom:4px;}
.stat-label{color:var(--muted);font-size:12px;}
.divider{width:1px;background:var(--border);}
.btn-review{width:100%;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);border-radius:12px;padding:14px;color:var(--red);font-size:15px;cursor:pointer;font-family:'Source Serif 4',serif;}
.btn-restart{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:12px;padding:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'Source Serif 4',serif;}
.btn-home{width:100%;background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:15px;cursor:pointer;font-family:'Source Serif 4',serif;}

/* ========= BOTTOM NAV ========= */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:600px;
  background:rgba(10,15,26,0.95);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:10px 0 20px;
  z-index:100;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 20px;border-radius:12px;transition:all 0.2s;border:none;background:none;}
.nav-item .nav-icon{font-size:22px;}
.nav-item .nav-label{font-size:10px;color:var(--muted);font-family:'Source Serif 4',serif;}
.nav-item.active .nav-label{color:var(--gold);}
.nav-item.active .nav-icon{filter:drop-shadow(0 0 6px rgba(232,160,32,0.6));}

.back-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;font-family:'Source Serif 4',serif;display:flex;align-items:center;gap:6px;padding:8px 0;margin-bottom:12px;}
.page-content{padding-bottom:90px;}

/* ========= BOLIM INFO ========= */
.bolim-info-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;text-align:center;margin-bottom:16px;}
.bolim-info-icon{font-size:48px;margin-bottom:12px;}
.bolim-info-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:8px;}
.bolim-info-desc{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:16px;}
.bolim-info-stats{display:flex;justify-content:space-around;padding:14px;background:rgba(255,255,255,0.04);border-radius:12px;margin-bottom:16px;}
.bis{text-align:center;}
.bis-num{font-size:20px;font-weight:700;}
.bis-label{font-size:11px;color:var(--muted);}
.btn-boshlash{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:14px;padding:16px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:'Source Serif 4',serif;letter-spacing:0.3px;}
</style>
</head>

function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

// ============ RENDER ============
function render(){
  const app=document.getElementById('app');
  let html='';
  if(state.screen==='home') html=renderHome();
  else if(state.screen==='fan') html=renderFan();
  else if(state.screen==='bolimInfo') html=renderBolimInfo();
  else if(state.screen==='quiz') html=renderQuiz();
  else if(state.screen==='result') html=renderResult();
  else if(state.screen==='reyting') html=renderReyting();
  else if(state.screen==='profil') html=renderProfil();
  app.innerHTML=html;
}

function renderQuiz(){
  const q=state.questions[state.current];
  const f=FANLAR[state.fanId];
  const pct=(state.current/state.questions.length)*100;
  const m=String(Math.floor(state.timeLeft/60)).padStart(2,'0');
  const s=String(state.timeLeft%60).padStart(2,'0');
  const urgent=state.timeLeft<300;
  const opts=q.o.map((opt,i)=>{
    let cls='option-btn',icon='<span class="option-circle"></span>',tc='#cde4f0';
    if(!state.confirmed&&state.selected===i){cls+=' selected';icon=`<span class="option-circle" style="background:${f.color};border-color:${f.color}"></span>`;}
    if(state.confirmed&&i===q.a){cls+=' correct';icon='<span class="option-circle" style="border:none;color:#10b981;font-size:16px">✓</span>';tc='#a8f0c0';}
    if(state.confirmed&&i===state.selected&&i!==q.a){cls+=' wrong';icon='<span class="option-circle" style="border:none;color:#ef4444;font-size:16px">✗</span>';tc='#f0a8a0';}
    return`<button class="${cls}" onclick="selOpt(${i})">${icon}<span class="option-text" style="color:${tc}">${opt}</span></button>`;
  }).join('');
  const expl=state.confirmed?`<div class="explanation"><p>💡 <strong>Izoh:</strong> ${q.e}</p></div>`:'';
  const btn=!state.confirmed
    ?`<button class="btn-confirm" onclick="confirmAns()" ${state.selected===null?'disabled':''}>Tasdiqlash</button>`
    :`<button class="btn-next" onclick="nextQ()">${state.current+1>=state.questions.length?'Natijani ko\'rish 🏁':'Keyingi →'}</button>`;
  return`<div class="quiz-screen fade-up">
    <div class="quiz-header">
      <span class="q-counter">${state.current+1}/${state.questions.length}</span>
      <span id="timer" class="timer${urgent?' urgent':''}" >⏱ ${m}:${s}</span>
      <span class="score-badge">✓ ${state.score}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,${f.color},${f.color2})"></div></div>
    <div class="card">
      <span class="category-tag" style="background:${f.color}22;border:1px solid ${f.color}66;color:${f.color}">${FANLAR[state.fanId].bolimlar.find(x=>x.id===state.bolimId)?.name||''}</span>
      <p class="question-text">${q.q}</p>
      <div class="options">${opts}</div>
      ${expl}
      <div class="btn-row">${btn}</div>
    </div>
  </div>`;
}

function renderResult(){
  const total=state.questions.length;
  const pct=Math.round((state.score/total)*100);
  const grade=pct>=90?"A'lo 🏆":pct>=70?"Yaxshi 👍":pct>=50?"Qoniqarli 📖":"Qoniqarsiz 💪";
  const gc=pct>=90?'#10b981':pct>=70?'#3b82f6':pct>=50?'#f59e0b':'#ef4444';
  const m=String(Math.floor(state.timeLeft/60)).padStart(2,'0');
  const sc=String(state.timeLeft%60).padStart(2,'0');
  return`<div class="result-screen">
    <div class="result-emoji">${pct>=70?'🎉':'📚'}</div>
    <h2 class="result-title">Test yakunlandi!</h2>
    <div class="result-score" style="color:${gc}">${state.score}/${total}</div>
    <div class="result-grade" style="color:${gc}">${grade} (${pct}%)</div>
    <div class="stats-box">
      <div class="stat"><div class="stat-num" style="color:#10b981">${state.score}</div><div class="stat-label">To'g'ri</div></div>
      <div class="divider"></div>
      <div class="stat"><div class="stat-num" style="color:#ef4444">${total-state.score}</div><div class="stat-label">Xato</div></div>
      <div class="divider"></div>
      <div class="stat"><div class="stat-num" style="color:#e8a020">${m}:${sc}</div><div class="stat-label">Qolgan</div></div>
    </div>
    <button class="btn-restart" onclick="startQuiz()">🔄 Qaytadan</button>
    <button class="btn-home" onclick="goTab('home')">🏠 Bosh sahifa</button>
  </div>`;
}

function renderBottomNav(){
  const tabs=[
    {id:'home',icon:'🏠',label:'Bosh'},

  ];

      <span class="nav-label">${t.label}</span>
    </button>`).join('')}

}

// ============ ACTIONS ============
function goTab(tab){
  state.tab=tab;
  if(tab==='home') state.screen='home';
  else if(tab==='reyting') state.screen='reyting';
  else if(tab==='profil') state.screen='profil';
  render();
}

function openFan(id){state.fanId=id;state.screen='fan';render();}

function openBolimInfo(id){state.bolimId=id;state.screen='bolimInfo';render();}

function startQuiz(){
  state.questions=shuffle(getSavollar(state.fanId,state.bolimId));
  state.current=0;state.selected=null;state.confirmed=false;
  state.score=0;state.wrong=[];state.timeLeft=30*60;
  state.screen='quiz';
  clearInterval(state.timer);
  state.timer=setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft<=0){clearInterval(state.timer);finishQuiz();return;}
    const el=document.getElementById('timer');
    if(el){
      const m=String(Math.floor(state.timeLeft/60)).padStart(2,'0');
      const s=String(state.timeLeft%60).padStart(2,'0');
      el.textContent='⏱ '+m+':'+s;
      el.className='timer'+(state.timeLeft<300?' urgent':'');
    }
  },1000);
  render();
}

function selOpt(i){if(state.confirmed)return;state.selected=i;render();}

function confirmAns(){
  if(state.selected===null)return;
  state.confirmed=true;
  const q=state.questions[state.current];
  if(state.selected===q.a)state.score++;
  else state.wrong.push({...q,chosen:state.selected});
  render();
}

function nextQ(){
  state.current++;
  if(state.current>=state.questions.length){finishQuiz();return;}
  state.selected=null;state.confirmed=false;
  render();
}

function finishQuiz(){
  clearInterval(state.timer);
  const total=state.questions.length;
  const pct=Math.round((state.score/total)*100);
  const f=FANLAR[state.fanId];
  const b=f.bolimlar.find(x=>x.id===state.bolimId);
  state.profil.totalTests++;
  state.profil.totalScore+=state.score*10;
  state.profil.history.push({fanId:state.fanId,bolim:b?.name||'',score:state.score,total,pct});
  state.screen='result';
  render();
}

function share(){
  const url='https://abdusaidyusupov008-collab.github.io/ona-tili-test';
  const text='DAI imtihoniga tayyorlanish uchun bu test platformasini sinab ko\'ring!';
  if(tg&&tg.shareUrl) tg.shareUrl(url,text);
  else if(navigator.share) navigator.share({title:'Test Platformasi',text,url});
  else{navigator.clipboard?.writeText(url);alert('Havola nusxalandi!');}
}

render();
</script>
